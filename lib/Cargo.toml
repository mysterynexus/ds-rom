[package]
name = "ds-rom"
version = "0.6.1"
edition = "2021"
authors = ["Aetias <aetias@outlook.com>"]
license = "MIT"
repository = "https://github.com/AetiasHax/ds-rom"
readme = "../README.md"
description = "Library for extracting/building Nintendo DS ROMs."

[dependencies]
bitfield-struct = "0.13.0"
bitreader = "0.3.11"
bytemuck = { version = "1.25.2", features = ["derive"] }
crc = "3.4.0"
encoding_rs = "0.8.42"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
rust-bitwriter = "0.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yml = "0.0.13"
sha1 = "0.11.0"
snafu = { version = "0.9.2", features = ["backtrace"] }

[dev-dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"

[lints.clippy]
needless_range_loop = "allow"
module_inception = "allow"
